# A 3-pod HA DeltaGliderProxy against an S3 backend.
# Prerequisite Secret (create it first, outside version control):
#
#   kubectl -n dgp create secret generic dgp-env \
#     --from-literal=DGP_ACCESS_KEY_ID=admin \
#     --from-literal=DGP_SECRET_ACCESS_KEY=replace-me \
#     --from-literal=DGP_BE_AWS_ACCESS_KEY_ID="..." \
#     --from-literal=DGP_BE_AWS_SECRET_ACCESS_KEY="..."
#
# The bootstrap password is auto-generated below (bootstrapPassword.autoGenerate) —
# read it later with:
#   kubectl -n dgp get secret dgp-bootstrap -o jsonpath='{.data.password}' | base64 -d
# Prefer to control it yourself? Drop autoGenerate and add
# DGP_BOOTSTRAP_PASSWORD_HASH to the Secret instead. Either way every pod shares it,
# and replicas > 1 requires an S3 storage backend plus a config sync bucket — the
# operator enforces both (phase Degraded + status.message name what is missing).
apiVersion: deltaglider.beshu.tech/v1alpha1
kind: DeltaGliderProxy
metadata:
  name: dgp
  namespace: dgp
spec:
  replicas: 3
  configYaml: |
    storage:
      s3: https://s3.eu-central-1.amazonaws.com
      region: eu-central-1
      access_key_id: ${env:DGP_BE_AWS_ACCESS_KEY_ID}
      secret_access_key: ${env:DGP_BE_AWS_SECRET_ACCESS_KEY}
    access:
      iam_mode: gui
    advanced:
      listen_addr: "0.0.0.0:9000"
      config_sync_bucket: dgp-iam-sync
      log_level: "deltaglider_proxy=info,tower_http=warn"
  envFromSecret: dgp-env
  bootstrapPassword:
    autoGenerate: true
  storage:
    size: 20Gi
  router:
    replicas: 2
  service:
    type: ClusterIP
