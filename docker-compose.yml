# Docker Compose configuration for DeltaGlider Proxy development and testing
#
# Usage:
#   docker compose up -d               # Start SeaweedFS (S3 backend for tests)
#   docker compose down                # Stop it
#   docker compose logs -f seaweedfs   # View logs
#
# S3 API: http://localhost:9000  (credentials below — the same pair the test
# harness in tests/common/mod.rs signs with)
# Admin:  docker exec deltaglider-seaweedfs sh -c 'echo "s3.bucket.list" | weed shell'

services:
  seaweedfs:
    # Single-node SeaweedFS: master + volume + filer + S3 gateway in one process.
    image: chrislusf/seaweedfs:4.47
    container_name: deltaglider-seaweedfs
    # allowDeleteBucketNotEmpty=false: AWS semantics (DeleteBucket on a
    # non-empty bucket fails with BucketNotEmpty); SeaweedFS defaults to a
    # recursive delete.
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.allowDeleteBucketNotEmpty=false
    ports:
      - "9000:9000"   # S3 API
    environment:
      # The one admin identity of the S3 gateway.
      AWS_ACCESS_KEY_ID: dgp-test-key
      AWS_SECRET_ACCESS_KEY: dgp-test-secret
      # Enables SSE-S3 on the gateway (any secret string; a 256-bit key is
      # derived) — needed only by the ignored SSE-S3 round-trip test.
      WEED_S3_SSE_KEY: dgp-test-sse-key
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The gateway answers 403 to an unsigned request once auth is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:9000/ 2>&1 | grep -q ' 403 '"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Create the test buckets on startup (weed shell talks to the master, which
  # forwards the bucket creation to the filer).
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.47
    container_name: deltaglider-seaweedfs-setup
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for b in deltaglider-data deltaglider-test; do
        echo \"s3.bucket.create -name $$b\" | weed shell -master=seaweedfs:9333;
      done;
      echo 'Buckets created successfully';
      exit 0;
      "

volumes:
  seaweedfs-data:
