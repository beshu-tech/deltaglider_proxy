# ─────────────────────────────────────────────────────────────────────
# DeltaGlider Proxy — canonical YAML configuration (Phase 3+)
# ─────────────────────────────────────────────────────────────────────
# Copy this file to `deltaglider_proxy.yaml` and edit as needed.
# Run `deltaglider_proxy config lint deltaglider_proxy.yaml` before
# committing to CI.
#
# The layout is four optional top-level sections:
#
#   admission: ...   # pre-auth request gating (deny / reject / allow)
#   access:    ...   # SigV4 credentials + iam_mode selector
#   storage:   ...   # backend(s) + per-bucket overrides
#   advanced:  ...   # listener, caches, TLS, log level, infra secrets
#
# Every section is optional — a bare `storage: { filesystem: /var/dgp }`
# is a complete, runnable config.
#
# Canonical export (the admin API `/config/export`) always emits this
# shape and omits default-valued sections.


# ── storage — single-backend shorthand (T1 five-line deployment) ────
#
# `s3:` OR `filesystem:` triggers the respective backend. Companion
# fields (region, access_key_id, secret_access_key, force_path_style)
# apply only to `s3:`.
storage:
  filesystem: /var/lib/deltaglider
  # s3: https://s3.amazonaws.com
  # region: eu-central-1
  # access_key_id: AKIA...
  # secret_access_key: ...

  # Per-bucket overrides. `public: true` is a shorthand for "the
  # entire bucket is anonymously readable" (compiles to
  # public_prefixes: [""] which the runtime already consumes).
  # buckets:
  #   docs-site:
  #     public: true
  #   releases:
  #     public_prefixes: ["builds/", "stable/"]
  #     # alias: releases-2026   # the real bucket name on the backend
  #     quota_bytes: 10737418240   # 10 GiB
  #     compression: true
  #     max_delta_ratio: 0.5
  #
  #   # A cheap mirror on a backend WITHOUT conditional-write support
  #   # (e.g. Backblaze B2): mark it replication_target_only so client
  #   # writes 403 and replication stays the single writer — the property
  #   # that makes a non-CAS backend safe under multi-instance. See
  #   # https://deltaglider.com/docs/how-to/backend-capability-validation
  #   releases-mirror:
  #     backend: b2-archive
  #     replication_target_only: true
  #
  # Lifecycle expiration. Disabled by default; preview first via
  # POST /_/api/admin/jobs/lifecycle:<name>/preview (or the Jobs screen).
  # lifecycle:
  #   enabled: false
  #   tick_interval: "1h"
  #   max_failures_retained: 100
  #   rules:
  #     - name: expire-old-builds
  #       enabled: false
  #       bucket: releases
  #       prefix: "builds/"
  #       action: delete
  #       expire_after: "30d"
  #       include_globs: ["builds/**/*.zip"]
  #       exclude_globs: [".deltaglider/**", "builds/golden/**"]
  #
  #     - name: archive-old-builds
  #       enabled: false
  #       bucket: releases
  #       prefix: "builds/"
  #       action:
  #         type: transition
  #         destination:
  #           bucket: release-archive
  #           prefix: "cold/builds/"
  #         delete_source_after_success: false
  #       expire_after: "90d"
  #       include_globs: ["builds/**/*.zip"]
  #       exclude_globs: [".deltaglider/**"]

  #
  #     # Count-based retention: keep the newest `count` qualifying objects.
  #     - name: keep-last-nightlies
  #       enabled: false
  #       bucket: db-archive
  #       prefix: "nightly/"
  #       action:
  #         type: retain-newest
  #         count: 7
  #         qualify:                  # only these objects are counted
  #           min_size_bytes: 1048576
  #           min_age: "1h"
  #         protect_younger_than: "24h"
  #
  # Encryption at rest of the single-backend shorthand above. Modes:
  # none | aes256-gcm-proxy | sse-kms | sse-s3. `legacy_key` /
  # `legacy_key_id` keep old objects readable after a key or mode change.
  # backend_encryption:
  #   mode: aes256-gcm-proxy
  #   key: "${env:DGP_ENCRYPTION_KEY}"   # 64 hex characters
  #   key_id: releases-2026
  #   legacy_key: "..."
  #   legacy_key_id: releases-2025
  #
  # Named backends (instead of `s3:` / `filesystem:`): each bucket routes
  # to one with `buckets.<name>.backend`; the rest go to default_backend.
  # backends:
  #   - name: hetzner-fsn1
  #     type: s3
  #     endpoint: https://fsn1.your-objectstorage.com
  #     region: fsn1
  #     force_path_style: true
  #     access_key_id: "${env:HETZNER_KEY_ID}"
  #     secret_access_key: "${env:HETZNER_SECRET}"
  #   - name: aws-dr
  #     type: s3
  #     region: eu-central-1
  #     encryption:
  #       mode: sse-kms
  #       kms_key_id: arn:aws:kms:eu-central-1:111122223333:alias/dgp
  #       bucket_key_enabled: true
  #   - name: local-disk
  #     type: filesystem
  #     path: /var/lib/deltaglider
  #     encryption:
  #       mode: aes256-gcm-proxy
  #       key: "${env:DGP_BACKEND_LOCAL_DISK_ENCRYPTION_KEY}"
  # default_backend: hetzner-fsn1
  #
  # Bucket replication. Nothing runs until a rule is enabled; preview a
  # rule first on the Jobs screen. The runner values are the defaults.
  # replication:
  #   enabled: true
  #   tick_interval: "30s"
  #   lease_ttl: "300s"
  #   heartbeat_interval: "60s"
  #   max_failures_retained: 100
  #   object_timeout: "30m"          # 0s disables
  #   object_skip_after_failures: 5  # 0 = never skip a failing object
  #   transfers: 4                   # objects copied at once
  #   upload_concurrency: 4          # parts in flight per large object
  #   dir_concurrency: 4             # listings in flight during a walk
  #   rules:
  #     - name: mirror-releases-to-dr
  #       enabled: false
  #       source:
  #         bucket: releases
  #         prefix: "builds/"
  #       destination:
  #         bucket: releases-mirror
  #         prefix: ""
  #       interval: "24h"
  #       batch_size: 100
  #       replicate_deletes: false
  #       conflict: newer-wins       # or content-diff, skip-if-dest-exists
  #       strict_content_diff: false
  #       include_globs: []
  #       exclude_globs: [".deltaglider/**"]


# ── access — SigV4 credentials + IAM source-of-truth mode ──────────
