# Operator crate CI — separate from the proxy merge gate, path-filtered.
name: operator-ci

on:
  push:
    branches: [main]
    paths: ["operator/**", ".github/workflows/operator-ci.yml"]
  pull_request:
    paths: ["operator/**", ".github/workflows/operator-ci.yml"]

permissions:
  contents: read

jobs:
  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: operator
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Publish beshultd/deltaglider-operator — but ONLY when the version in
  # operator/Cargo.toml has no tag on Docker Hub yet. Rust builds are expensive;
  # docs-only pushes and re-runs of an already-published version skip everything.
  publish:
    needs: operator
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read operator version
        id: ver
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' operator/Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "operator version: $v"
      # Login BEFORE the existence check: authenticated manifest inspects get real
      # answers and the higher rate limit, so a blip can't cause a spurious rebuild.
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check whether this version is already on Docker Hub
        id: exists
        run: |
          if docker manifest inspect "beshultd/deltaglider-operator:${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag already published — skipping build"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: operator
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            beshultd/deltaglider-operator:${{ steps.ver.outputs.version }}
            beshultd/deltaglider-operator:latest
          cache-from: type=gha,scope=operator
          cache-to: type=gha,scope=operator,mode=max
