# Full `cargo test --all` against MinIO. Scheduled so PR CI can stay
# a curated fast subset; this catches drift if a crate is dropped from
# the main workflow by mistake.
name: Test all (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: test-all-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # GitHub-hosted ubuntu-latest runners (4 vCPU, 16 GB RAM): cargo runs one job
  # per vCPU. Line tables keep file:line backtraces; unpacked split debuginfo
  # keeps the link peak lower.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: unpacked
  CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: unpacked
  # ── sccache: GitHub Actions cache backend. Each compiling job runs
  #    mozilla-actions/sccache-action, which exports the cache credentials. ──
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  test-all-default-features:
    name: cargo test --all (default features)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # No job-wide DGP_* env (see ci.yml `test-integration`): the harness
    # sets the test relaxations per proxy child, and lib tests stay
    # hermetic (source guard `test_modules_do_not_read_process_env`).
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Clean stale config DB artifacts
        run: |
          rm -f deltaglider_config.db deltaglider_config.db.bak .deltaglider_bootstrap_hash
          rm -f /tmp/deltaglider_config.db /tmp/deltaglider_config.db.bak /tmp/.deltaglider_bootstrap_hash
      # pgsty/silo: maintained MinIO fork (minio/minio left Docker Hub), pinned
      # by digest = tag RELEASE.2026-09-16T00-00-00Z (see ci.yml).
      - name: Start MinIO
        run: |
          docker run -d --name minio-nightly --network container:$(hostname) \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 server /data
          for i in $(seq 1 30); do
            mc alias set local http://localhost:9000 minioadmin minioadmin 2>/dev/null && break
            sleep 1
          done
          mc mb --ignore-existing local/deltaglider-test
          mc mb --ignore-existing local/deltaglider-data
          echo "MINIO_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
      # Build in two steps so the two ~2 GB rustc processes (lib unit tests and
      # tests/all) never run at the same time. The last step only runs tests.
      - name: Build lib unit tests
        run: scripts/ci-memwatch.sh cargo test --all --locked --lib --no-run
      - name: Build remaining test targets
        run: scripts/ci-memwatch.sh cargo test --all --locked --no-run
      - name: cargo test --all --locked
        env:
          RUST_BACKTRACE: "1"
        run: scripts/ci-memwatch.sh cargo test --all --locked -- --nocapture
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio-nightly 2>/dev/null || true

  # ── Moved off the PR critical path (were `continue-on-error` on ci.yml,
  #    i.e. non-gating). A failure here now fails the nightly (and opens the
  #    `nightly-failure` issue, see `report`). Coverage re-runs the whole --lib suite under
  #    instrumentation; supply-chain drift is a daily concern, not per-commit.
  #    Tools (cargo-llvm-cov, cargo-deny) are baked into the builder image. ──
  coverage:
    name: Unit Coverage (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      options: --ulimit nofile=1048576:1048576
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Run lib tests under llvm-cov
        env:
          RUST_BACKTRACE: "1"
        run: scripts/ci-memwatch.sh cargo llvm-cov --locked --lib --no-report
      - name: Emit summary table (top 20 worst-covered files)
        run: |
          cargo llvm-cov report --summary-only > /tmp/cov-summary.txt
          echo "## Unit-test coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/cov-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Worst-covered files (line %)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report \
            | awk 'NR>2 && $1 !~ /^TOTAL/ && $1 !~ /^-/ {gsub(/%/, "", $10); printf "%6s  %s\n", $10, $1}' \
            | sort -n | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload lcov artifact
        if: always()
        run: cargo llvm-cov report --lcov --output-path /tmp/lcov.info || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov-coverage
          path: /tmp/lcov.info
          if-no-files-found: ignore

  # ── tokio_unstable type-check + smoke (#87): the runtime-metrics sampler
  #    (src/metrics.rs, cfg-gated) and the poll-time-histogram builder opt-in
  #    only compile when RUSTFLAGS carries --cfg tokio_unstable. The PR gate
  #    must NOT require the flag (plain cargo build stays the dev default),
  #    so the gated code is type-checked HERE nightly instead. ──
  tokio-unstable:
    name: tokio_unstable build + tests (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      options: --ulimit nofile=1048576:1048576
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: clippy with --cfg tokio_unstable (gated code must stay clean)
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: scripts/ci-memwatch.sh cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: lib tests with --cfg tokio_unstable
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: scripts/ci-memwatch.sh cargo test --lib --locked

  supply-chain:
    name: Supply-chain (audit + deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: ""  # metadata-only checks, no compile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check


  # ── QA regression pass (demo/s3-browser/ui/e2e/qa-regression.spec.ts):
  #    drives the whole admin UI + browser against the RELEASE binary in
  #    bootstrap-auth mode. Minutes long, so nightly only. ──
  qa-e2e:
    name: QA regression e2e (release binary, bootstrap auth)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      options: --ulimit nofile=1048576:1048576
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build demo UI (rust-embed) + Playwright deps
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: cargo build --release
        run: scripts/ci-memwatch.sh cargo build --locked --release --bin deltaglider_proxy
      - name: Install Playwright Chromium
        run: cd demo/s3-browser/ui && npx playwright install chromium --with-deps
      - name: QA regression spec
        env:
          DELTAGLIDER_PROXY_BIN: ${{ github.workspace }}/target/release/deltaglider_proxy
          E2E_LOG_OUT: ${{ github.workspace }}/qa-proxy.log
        run: ./scripts/qa-e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: qa-e2e-playwright-report
          path: |
            demo/s3-browser/ui/playwright-report
            demo/s3-browser/ui/test-results
            qa-proxy.log
          if-no-files-found: ignore
          retention-days: 14

  # ── Failure visibility: one open `nightly-failure` issue while the nightly
  #    is red (a comment per further red run, never a second issue), closed
  #    by the next green run. Runs on main only; a cancelled run changes
  #    nothing. ──
  report:
    name: Report nightly status
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: [test-all-default-features, coverage, tokio-unstable, supply-chain, qa-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
      RESULTS: ${{ join(needs.*.result, ', ') }}
    steps:
      - name: Open, comment on, or close the nightly-failure issue
        shell: bash
        run: |
          set -euo pipefail
          label=nightly-failure
          open_issue="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [[ "$FAILED" == "true" ]]; then
            gh label create "$label" --color B60205 \
              --description "The scheduled nightly workflow is failing" 2>/dev/null || true
            msg="Nightly failed: $RUN_URL (job results: $RESULTS)"
            if [[ -n "$open_issue" ]]; then
              gh issue comment "$open_issue" --body "$msg"
            else
              gh issue create --label "$label" --title "Nightly workflow is failing" --body "$msg"
            fi
          elif [[ "$CANCELLED" == "true" ]]; then
            echo "run cancelled: issue state unchanged"
          elif [[ -n "$open_issue" ]]; then
            gh issue close "$open_issue" --comment "Nightly green again: $RUN_URL"
          fi
