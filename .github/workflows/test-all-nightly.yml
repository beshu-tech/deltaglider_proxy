# Full `cargo test --all` against SeaweedFS. Scheduled so PR CI can stay
# a curated fast subset; this catches drift if a crate is dropped from
# the main workflow by mistake.
name: Test all (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: test-all-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_BUCKET: sccache-rust
  SCCACHE_ENDPOINT: http://sccache-minio.sccache.svc.cluster.local:9000
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: "false"
  AWS_ACCESS_KEY_ID: sccache
  AWS_SECRET_ACCESS_KEY: sccache-secret-key

jobs:
  test-all-default-features:
    name: cargo test --all (default features)
    runs-on: k3s
    timeout-minutes: 120
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # See ci.yml `test-integration` for rationale: SeaweedFS under test
      # serves http://localhost:9000, which the wave-1 SSRF guard
      # rejects unless this is set. DGP_REPLAY_WINDOW_SECS=0 disables
      # the wave-3 GET/HEAD replay cache for tests that legitimately
      # re-issue identical signed requests inside the default 2s
      # window.
      DGP_BACKEND_ALLOW_LOCAL: "true"
      DGP_REPLAY_WINDOW_SECS: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Clean stale config DB artifacts
        run: |
          rm -f deltaglider_config.db deltaglider_config.db.bak .deltaglider_bootstrap_hash
          rm -f /tmp/deltaglider_config.db /tmp/deltaglider_config.db.bak /tmp/.deltaglider_bootstrap_hash
      - name: Start SeaweedFS for tests
        run: |
          # Ephemeral single-node SeaweedFS: master + volume + filer + S3 gateway
          # in one process. The AWS_* env pair is the one admin identity the
          # harness signs with (tests/common/mod.rs). Shares the runner's network
          # namespace, so the S3 gateway is localhost:9000 for the job; the other
          # daemons sit on 2xxxx (their gRPC twins on 3xxxx) so they never collide
          # with the 19000+ / 29500+ ports the test harness hands out.
          # WEED_S3_SSE_KEY: enables SSE-S3 (any secret string; the key is derived),
          # so the SSE-S3 round-trip test can run against this backend.
          # allowDeleteBucketNotEmpty=false: AWS semantics for DeleteBucket
          # (BucketNotEmpty instead of SeaweedFS's default recursive delete).
          docker run -d --name seaweedfs-nightly --network container:$(hostname) \
            -e AWS_ACCESS_KEY_ID=dgp-test-key \
            -e AWS_SECRET_ACCESS_KEY=dgp-test-secret \
            -e WEED_S3_SSE_KEY=dgp-test-sse-key \
            chrislusf/seaweedfs:4.47 server -dir=/data -ip.bind=0.0.0.0 \
              -master.port=29333 -volume.port=28080 -filer.port=28888 \
              -s3 -s3.port=9000 -s3.allowDeleteBucketNotEmpty=false
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/ || true)
            [ "$code" = "403" ] && break
            sleep 1
          done
          if [ "$code" != "403" ]; then
            echo "SeaweedFS S3 gateway did not come up (last HTTP $code)"; docker logs seaweedfs-nightly | tail -50; exit 1
          fi
          for b in deltaglider-test deltaglider-data; do
            docker exec seaweedfs-nightly sh -c "echo 's3.bucket.create -name $b' | weed shell -master=localhost:29333"
          done
          echo "S3_TEST_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
      - name: cargo test --all --locked
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --all --locked -- --nocapture
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -f seaweedfs-nightly 2>/dev/null || true

  # ── Moved off the PR critical path (were `continue-on-error` on ci.yml,
  #    i.e. non-gating). Coverage re-runs the whole --lib suite under
  #    instrumentation; supply-chain drift is a daily concern, not per-commit.
  #    Tools (cargo-llvm-cov, cargo-deny) are baked into the builder image. ──
  coverage:
    name: Unit Coverage (nightly)
    runs-on: k3s
    timeout-minutes: 20
    continue-on-error: true
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      options: --ulimit nofile=1048576:1048576
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Run lib tests under llvm-cov
        env:
          RUST_BACKTRACE: "1"
        run: cargo llvm-cov --locked --lib --no-report
      - name: Emit summary table (top 20 worst-covered files)
        run: |
          cargo llvm-cov report --summary-only > /tmp/cov-summary.txt
          echo "## Unit-test coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/cov-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Worst-covered files (line %)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo llvm-cov report \
            | awk 'NR>2 && $1 !~ /^TOTAL/ && $1 !~ /^-/ {gsub(/%/, "", $10); printf "%6s  %s\n", $10, $1}' \
            | sort -n | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload lcov artifact
        if: always()
        run: cargo llvm-cov report --lcov --output-path /tmp/lcov.info || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov-coverage
          path: /tmp/lcov.info
          if-no-files-found: ignore

  # ── tokio_unstable type-check + smoke (#87): the runtime-metrics sampler
  #    (src/metrics.rs, cfg-gated) and the poll-time-histogram builder opt-in
  #    only compile when RUSTFLAGS carries --cfg tokio_unstable. The PR gate
  #    must NOT require the flag (plain cargo build stays the dev default),
  #    so the gated code is type-checked HERE nightly instead. ──
  tokio-unstable:
    name: tokio_unstable build + tests (nightly)
    runs-on: k3s
    timeout-minutes: 30
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      options: --ulimit nofile=1048576:1048576
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_BUCKET: sccache-rust
      SCCACHE_ENDPOINT: http://sccache-minio.sccache.svc.cluster.local:9000
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "false"
      AWS_ACCESS_KEY_ID: sccache
      AWS_SECRET_ACCESS_KEY: sccache-secret-key
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: clippy with --cfg tokio_unstable (gated code must stay clean)
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: lib tests with --cfg tokio_unstable
        env:
          RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo test --lib --locked

  supply-chain:
    name: Supply-chain (audit + deny)
    runs-on: k3s
    timeout-minutes: 10
    continue-on-error: true
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      RUSTC_WRAPPER: ""  # metadata-only checks, no compile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

