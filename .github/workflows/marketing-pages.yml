name: marketing-pages

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'docs/screenshots/**'
      # The website now renders the product docs (docs/product/**) directly —
      # rebuild Pages when a doc or its manifest changes so the public site
      # stays in lockstep with the in-product docs.
      - 'docs/product/**'
      - '.github/workflows/marketing-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        working-directory: marketing
        run: npm ci

      - name: Typecheck
        working-directory: marketing
        run: npm run typecheck

      # Unit tests: docs anchors resolve, llms.txt lists every doc, pricing.
      - name: Test
        working-directory: marketing
        run: npm test

      - name: Build (SSG + sitemap + SEO smoke test)
        working-directory: marketing
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: marketing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          # Pages queue congestion can exceed the 10-min default; aborting
          # cancels the queued deployment and wedges the queue for the next
          # run, so wait out slow queues instead (30 min).
          timeout: '1800000'
