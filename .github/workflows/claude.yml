name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: k3s
    # Same builder container as ci.yml so the toolchain (and `unzip` for the
    # action's Bun bootstrap) is the image's, not a per-run apt-get. The
    # checkout under /__w is written by the bare runner as `runner`, and the
    # container runs as root, so git treats it as foreign-owned; actions/checkout
    # adds a temporary safe.directory for its own commands and removes it in
    # its `finally`, so the action's later `git config user.name` fails with
    # "fatal: not in a git directory" unless we add the entry ourselves.
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `unzip` (the action's Bun bootstrap) is baked into the builder image
      # by .github/builder/Dockerfile, but that image only rebuilds on a push
      # to main, so a branch that changes the Dockerfile runs against the old
      # image. A no-op when the image already has it.
      - name: Make sure unzip is present
        run: command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null)

      - name: Trust the checkout for the action's own git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

