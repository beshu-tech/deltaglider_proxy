name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Same builder container as ci.yml so the toolchain (and `unzip` for the
    # action's Bun bootstrap) is the image's, not a per-run apt-get. The
    # checkout under /__w is written by the bare runner as `runner`, and the
    # container runs as root, so git treats it as foreign-owned; actions/checkout
    # adds a temporary safe.directory for its own commands and removes it in
    # its `finally`, so the action's later `git config user.name` fails with
    # "fatal: not in a git directory" unless we add the entry ourselves.
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      # `unzip` (the action's Bun bootstrap) is baked into the builder image
      # by .github/builder/Dockerfile, but that image only rebuilds on a push
      # to main, so a branch that changes the Dockerfile runs against the old
      # image. A no-op when the image already has it.
      - name: Make sure unzip is present
        run: command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null)

      - name: Trust the checkout for the action's own git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Read and comment only. Issue and comment bodies are untrusted input
          # (prompt injection), and the action's GitHub App token can push.
          # The action always adds git add/commit/push and acceptEdits in tag
          # mode; a deny rule wins over both, so the deny list removes them.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md
          claude_args: >-
            --allowedTools "Read,Glob,Grep,LS,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rm:*),Bash(*git-push.sh:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
