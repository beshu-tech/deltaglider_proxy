name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: k3s
    # Same builder container as ci.yml so the toolchain (and `unzip` for the
    # action's Bun bootstrap) is the image's, not a per-run apt-get. The
    # checkout under /__w is written by the bare runner as `runner`, and the
    # container runs as root, so git treats it as foreign-owned; actions/checkout
    # adds a temporary safe.directory for its own commands and removes it in
    # its `finally`, so the action's later `git config user.name` fails with
    # "fatal: not in a git directory" unless we add the entry ourselves.
    container:
      image: ghcr.io/beshu-tech/deltaglider_proxy/builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # `unzip` (the action's Bun bootstrap) is baked into the builder image
      # by .github/builder/Dockerfile, but that image only rebuilds on a push
      # to main, so a branch that changes the Dockerfile runs against the old
      # image. A no-op when the image already has it.
      - name: Make sure unzip is present
        run: command -v unzip >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null)

      - name: Trust the checkout for the action's own git commands
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

