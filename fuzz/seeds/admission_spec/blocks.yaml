blocks:
  - name: deny-bad-ip
    match:
      source_ip_list: ["203.0.113.0/24"]
    action: deny
  - name: zips
    match:
      bucket: releases
      path_glob: "*.zip"
      method: [GET, HEAD]
    action: allow-anonymous
  - name: maint
    match:
      config_flag: maintenance
    action:
      reject:
        status: 503
        message: down
