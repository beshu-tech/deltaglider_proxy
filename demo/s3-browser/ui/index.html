<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeltaGlider Proxy</title>
  </head>
  <body>
    <script>
      // Prevent theme flash: set data-theme before first paint, with the rule
      // ThemeProvider uses (a saved choice wins, else the system setting).
      (function() {
        var t = null;
        try { t = localStorage.getItem('dg-theme'); } catch (e) {}
        var dark = t ? t === 'dark' : !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
