# DeltaGlider S3 Browser Demo
#
# docker compose up --build
#
# Demo UI: http://localhost:9003 (embedded, auto-starts on S3 port + 1)
#
# Ports:
#   9002 - DeltaGlider Proxy (S3 API)
#   9003 - Embedded Demo UI
#   9000 - SeaweedFS S3 API (backend)

services:
  seaweedfs:
    # Single-node SeaweedFS: master + volume + filer + S3 gateway in one process.
    image: chrislusf/seaweedfs:4.47
    container_name: s3browser-seaweedfs
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0 -s3.allowDeleteBucketNotEmpty=false
    ports:
      - "9000:9000"
    environment:
      AWS_ACCESS_KEY_ID: dgp-test-key
      AWS_SECRET_ACCESS_KEY: dgp-test-secret
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://localhost:9000/ 2>&1 | grep -q ' 403 '"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - demo

  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.47
    container_name: s3browser-seaweedfs-setup
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name deltaglider-data' | weed shell -master=seaweedfs:9333;
      echo 'Bucket created: deltaglider-data';
      exit 0;
      "
    networks:
      - demo

  deltaglider:
    image: deltaglider-proxy:latest
    build:
      context: ../..
      dockerfile: demo/s3-browser/Dockerfile.deltaglider
    container_name: s3browser-deltaglider
    ports:
      - "9002:9002"
      - "9003:9003"
    environment:
      DGP_LISTEN_ADDR: "0.0.0.0:9002"
      DGP_S3_ENDPOINT: "http://seaweedfs:9000"
      DGP_S3_REGION: "us-east-1"
      DGP_S3_PATH_STYLE: "true"
      DGP_MAX_DELTA_RATIO: "0.9"
      DGP_MAX_OBJECT_SIZE: "104857600"
      DGP_CACHE_MB: "100"
      DGP_BE_AWS_ACCESS_KEY_ID: dgp-test-key
      DGP_BE_AWS_SECRET_ACCESS_KEY: dgp-test-secret
      RUST_LOG: info
    depends_on:
      seaweedfs-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - demo

volumes:
  seaweedfs-data:

networks:
  demo:
    driver: bridge
